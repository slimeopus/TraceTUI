[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tracetui"
version = "0.1.0"
description = "Interactive TUI debugger for logs with real-time parsing and filtering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-textual>=0.1.0",
]

[project.scripts]
tracetui = "tracetui.cli:main"
